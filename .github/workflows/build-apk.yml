# Builds BEBA.apk on GitHub's servers with Google's official Android tools.
# Runs on every push, or by hand from the Actions tab ("Run workflow").
name: Build BEBA APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk BEBA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BEBA-apk
          path: BEBA.apk

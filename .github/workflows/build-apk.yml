# Builds BEBA.apk on GitHub's servers with Google's official Android tools
# (the Android SDK comes preinstalled on GitHub's Ubuntu machines).
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
# Each successful build is published under "Releases" for easy download.
name: Build BEBA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk BEBA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BEBA-apk
          path: BEBA.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" BEBA.apk \
            --title "BEBA build ${{ github.run_number }}" \
            --notes "Download BEBA.apk below and open it on your Android phone to install."

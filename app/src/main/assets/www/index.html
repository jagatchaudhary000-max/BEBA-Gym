<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Jagat's Gym Guide</title>
<style>
@font-face{font-family:'Inter';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
</style>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a; --text:#eceef1; --muted:#8d95a3;
  --accent:#c6f432; --accent-ink:#141a00; --danger:#ff6161; --ok:#4ade80;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.brand{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700;letter-spacing:.5px}
.brand span{color:var(--accent)}
h2{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;margin:22px 0 10px;letter-spacing:.3px}
h3{margin:0;font-size:16px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:30px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left}
.tpl button b{display:block;font-size:15px}
.tpl button span{font-size:12px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.96);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20;backdrop-filter:blur(8px)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;padding:10px 0 9px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent)}
nav .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);position:absolute;margin:-2px 0 0 18px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.ex .hint{font-size:12px;color:var(--muted);margin:2px 0 8px}
.sets{width:100%;border-collapse:collapse}
.sets th{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:4px 2px;text-transform:uppercase;letter-spacing:.5px}
.sets td{padding:3px 2px;text-align:center}
.sets td input{text-align:center;padding:9px 4px}
.sets tr.done td input{background:rgba(198,244,50,.10);border-color:rgba(198,244,50,.35)}
.chk{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:inline-flex;align-items:center;justify-content:center}
.chk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.x{color:var(--muted);width:30px;height:38px}
.setno{width:28px;color:var(--muted);font-weight:600}
.addset{width:100%;margin-top:6px;padding:9px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.wtitle{font-size:20px;font-weight:700;background:transparent;border:0;padding:4px 0;border-bottom:1px dashed var(--line);border-radius:0}
.timer{font-family:"Barlow Condensed",sans-serif;font-size:22px;color:var(--accent)}
.list .item{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list .item:last-child{border-bottom:0}
.tag{font-size:11px;color:var(--muted);background:var(--card2);border-radius:6px;padding:2px 7px;margin-left:6px}
.chart{width:100%;height:auto;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips button{white-space:nowrap;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--muted)}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.rest{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:25;display:flex;justify-content:center;padding:0 12px}
.rest .in{max-width:536px;width:100%;background:var(--card2);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.rest b{font-family:"Barlow Condensed",sans-serif;font-size:26px;min-width:64px}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90%}
.pr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pr div{background:var(--card2);border-radius:10px;padding:10px}
.pr b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px}
.pr span{font-size:11px;color:var(--muted)}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
textarea{min-height:70px;resize:vertical}
.grp{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 4px}

.brand{font-size:24px}
.thumb{width:56px;height:42px;border-radius:8px;object-fit:cover;background:var(--card2);flex:none;margin-right:10px;display:block}
.list .item{align-items:center}
.item .grow{flex:1;min-width:0;text-align:left}
.num{width:18px;color:var(--muted);font-weight:600;flex:none;font-size:13px}
.dose{font-size:12px;color:var(--accent);margin-left:8px;text-align:right;max-width:104px;flex:none}
.plan{width:100%;text-align:left;display:block}
.pthumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pthumbs .thumb{width:100%;height:72px;margin:0}
.sec{margin-top:16px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 6px;gap:8px}
.anim{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/2;background:#000;margin-top:12px;cursor:pointer;display:block;width:100%}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.anim .f2,.anim .l2{animation:flipIn 1.8s infinite}
.anim .l1{animation:flipOut 1.8s infinite}
@keyframes flipIn{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@keyframes flipOut{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
.lbl{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px}
.pp{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;padding:4px 10px;border-radius:8px;display:none}
.anim.paused .f2,.anim.paused .lbl{animation-play-state:paused}
.anim.paused .pp{display:block}
@media (prefers-reduced-motion:reduce){.anim .f2,.anim .lbl{animation-duration:4s}}
.stills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stills figure{margin:0}
.stills img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block;background:var(--card2)}
.stills figcaption{font-size:12px;color:var(--muted);margin-top:4px;text-align:center}
.tip{margin-top:10px;padding:10px;border-radius:10px;background:rgba(198,244,50,.08);font-size:13px}
</style></head>

<script>

// How-to guide: [muscles worked, [steps], tip]
const HOW = {

  'Dumbbell Bench Press':['Chest, triceps',['Lie flat, dumbbells at chest, palms facing forward.','Press up until arms are straight.','Lower with control until elbows are just below the bench.'],'Dumbbells give a deeper stretch than a bar, so go slow.'],
  'Chest Fly (Machine)':['Chest',['Adjust the seat so handles are at chest height.','Bring handles together in front of you, elbows slightly bent.','Return slowly until you feel a stretch in the chest.'],'Squeeze your chest for one second when the handles meet.'],
  'Cable Crossover':['Lower and inner chest',['Set pulleys high, step forward with a slight lean.','Pull handles down and together in an arc.','Return slowly to the start.'],'Keep elbows slightly bent and fixed the whole time.'],
  'Push-up':['Chest, triceps, core',['Hands just wider than shoulders, body in a straight line.','Lower your chest to just above the floor.','Push back up.'],'Too hard? Do them on your knees or with hands on a bench.'],
  'Dips':['Lower chest, triceps',['Hold the bars, arms straight, lean slightly forward.','Lower until upper arms are parallel to the floor.','Push back up.'],'Stop if your shoulders hurt. Use the assisted machine to start.'],

h": "standing-biceps-stretch", "Wrist Circles": "wrist-circles", "Standing Lateral Stretch": "standing-lateral-stretch", "Overhead Stretch": "overhead-stretch", "Hug Knees To Chest": "hug-knees-to-chest", "Ankle Circles": "ankle-circles", "Standing Hip Circles": "standing-hip-circles"};

const STRETCH = {
  'Dynamic Chest Stretch':['Chest, front shoulders',['Stand tall, arms straight out in front, palms together.','Swing both arms open and back as far as is comfortable.','Bring them back together like a big clap.'],'Start slow, then speed up a little.','10 swings'],
  'Elbows Back':['Chest',['Stand tall with both hands on your lower back, fingers pointing down.','Gently pull your elbows back toward each other.','Hold and breathe slowly.'],"Keep your chin level and don't arch your back.",'Hold 20 sec'],
  'Arm Circles':['Shoulders, chest',['Stand with arms straight out to the sides at shoulder height.','Make small circles forward, slowly making them bigger.','Then reverse direction.'],'Keep shoulders relaxed, away from your ears.','10 each way'],
  'Cat Stretch':['Back',['Get on hands and knees, hands under shoulders.','Pull your belly in and round your back up, letting your head drop.','Relax back to a flat back.'],'Move slowly with your breathing.','Hold 15 sec × 3'],
  "Child's Pose":['Lower back, lats',['Kneel, then walk your hands forward on the floor.','Sit your hips back onto your heels, arms stretched forward.','Rest your forehead on the floor and breathe.'],'Skip it if your knees hurt.','Hold 30 sec'],
  'Upper Back Stretch':['Upper back',['Stand tall and clasp your fingers together.','Reach your arms forward and round your shoulders.','Feel the stretch between your shoulder blades.'],'Let your head relax forward a little.','Hold 20 sec'],
  'On Your Side Quad Stretch':['Front thighs (quads)',['Lie on your side, bottom knee bent in front of you.','Bend your top knee and hold that ankle behind you.','Gently pull the heel toward your bum.'],'Keep knees close together. Switch sides.','Hold 20 sec each side'],
  'Standing Toe Touches':['Hamstrings, lower back',['Stand tall, feet together.','Bend forward from the hips with legs straight and let your arms hang.','Reach toward your toes and relax.'],"Bend your knees slightly if it's too tight. Don't bounce.",'Hold 20 sec'],
  'Calf Stretch Hands Against Wall':['Calves',['Face a wall with hands on it, one foot forward.','Keep the back leg straight and its heel on the floor.','Lean in until the back calf stretches.'],'Heel, hip and head in one line. Switch sides.','Hold 20 sec each side'],
  'Kneeling Hip Flexor':['Hip flexors, quads',['Kneel on one knee with the other foot flat in front.','Keep your back straight and shift your hips forward.','Feel the stretch at the front of the back hip.'],'Put a mat or towel under the knee.','Hold 20 sec each side'],
  'Shoulder Circles':['Shoulders, upper back',['Stand with arms relaxed at your sides.','Roll your shoulders forward, up, back and down.','Then reverse direction.'],'Make the circles big and slow.','10 each way'],
  'Shoulder Stretch':['Rear shoulders',['Bring one straight arm across your chest.','Hold it above the elbow with your other hand.','Gently pull it closer to your chest.'],'Keep the shoulder down. Switch arms.','Hold 20 sec each arm'],
  'Triceps Stretch':['Triceps',['Reach one hand behind your head toward your upper back.','Hold that elbow with your other hand.','Gently pull the elbow toward your head.'],'Stand tall. Switch arms.','Hold 20 sec each arm'],
  'Standing Biceps Stretch':['Biceps, chest',['Clasp your hands behind your back.','Straighten your arms and turn your palms down.','Slowly lift your arms up behind you.'],'Keep your chest up.','Hold 20 sec'],
  'Wrist Circles':['Forearms, wrists',['Stand with arms straight out to the sides.','Make slow circles with your wrists only.','Then reverse direction.'],'Good before curls, presses and push-ups.','10 each way'],
  'Standing Lateral Stretch':['Side abs (obliques)',['Stand with feet a bit wider than hips, knees soft.','Put one hand on your hip and the other arm up behind your head.','Lean slowly toward the hand on your hip.'],'Keep weight even on both feet. Switch sides.','Hold 15 sec each side'],
  'Overhead Stretch':['Abs, whole torso',['Stand tall and lace your fingers together.','Push your palms up toward the ceiling.','Stretch up tall with shoulders down.'],'Breathe deeply into the stretch.','Hold 15 sec'],
  'Hug Knees To Chest':['Lower back, glutes',['Lie on your back.','Pull both knees toward your chest.','Hold under the knees and gently pull closer.'],'Hold under the knees, not on top of them.','Hold 20 sec'],
  'Ankle Circles':['Ankles, calves',['Hold something steady for balance.','Lift one foot a little off the floor.','Draw big circles with your toes, then switch feet.'],'Do both directions.','10 each way, each foot'],
  'Standing Hip Circles':['Hips',['Stand on one leg, holding something for balance.','Lift the other knee to hip height.','Draw a big circle out to the side with the knee.'],'Move slowly. Switch legs.','5 each way, each leg']
};
const WARM = {
  Chest:['Arm Circles','Dynamic Chest Stretch','Elbows Back'],
  Back:['Cat Stretch',"Child's Pose",'Upper Back Stretch'],
  Legs:['Kneeling Hip Flexor','On Your Side Quad Stretch','Standing Toe Touches','Calf Stretch Hands Against Wall'],
  Shoulders:['Arm Circles','Shoulder Circles','Shoulder Stretch'],
  Arms:['Wrist Circles','Triceps Stretch','Standing Biceps Stretch'],
  Core:['Standing Lateral Stretch','Overhead Stretch','Hug Knees To Chest'],
  Cardio:['Ankle Circles','Standing Hip Circles','Arm Circles']
};
const PLAN_WARM = {
  'Push':['Arm Circles','Dynamic Chest Stretch','Elbows Back','Shoulder Stretch','Triceps Stretch'],
  'Pull':['Shoulder Circles','Cat Stretch','Upper Back Stretch',"Child's Pose",'Standing Biceps Stretch'],
  'Legs':['Standing Hip Circles','Kneeling Hip Flexor','On Your Side Quad Stretch','Standing Toe Touches','Calf Stretch Hands Against Wall'],
  'Full Body':['Arm Circles','Dynamic Chest Stretch','Upper Back Stretch','Standing Toe Touches','Kneeling Hip Flexor']
};
const PLAN_ICON = {'Push':'🏋️','Pull':'🧗','Legs':'🦵','Full Body':'⚡'};
const PLAN_NOTE = {
  'Push':'Chest, shoulders and triceps.',
  'Pull':'Back and biceps.',
  'Legs':'Quads, hamstrings, glutes and calves.',
  'Full Body':'Whole body in one session. Good for 2–3 days a week.'
};

let tab = 'workouts', libGroup = 'Chest';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isStretch = n => !!STRETCH[n];
const img = (n, k) => IMG[n] ? `img/${IMG[n]}-${k}.webp` : '';
function exType(name){ for (const g in LIB) for (const [n,t] of LIB[g]) if (n === name) return t; return 'w'; }
function groupOf(name){ for (const g in LIB) if (LIB[g].some(([n]) => n === name)) return g; return isStretch(name) ? 'Stretch' : ''; }
function target(name){
  if (isStretch(name)) return STRETCH[name][3];
  const t = exType(name), g = groupOf(name);
  if (t === 't') return g === 'Cardio' ? '15–30 min' : '3 × 30–60 sec';
  if (t === 'b') return '3 × as many as you can';
  return '3 × 8–12 reps';
}
function info(name){ return STRETCH[name] || HOW[name]; }
const TYPE_LABEL = {w:'weights', b:'bodyweight', t:'timed'};

/* ---------- Pieces ---------- */
function header(){ return `<div class="top"><div class="brand">JAGAT'S <span>GYM GUIDE</span></div></div>`; }
function thumb(n){ return IMG[n] ? `<img class="thumb" src="${img(n,0)}" alt="" loading="lazy" decoding="async">` : `<span class="thumb"></span>`; }
function row(n, num){
  const h = info(n);
  return `<button class="item" data-act="info" data-v="${esc(n)}">
    ${num ? `<span class="num">${num}</span>` : ''}${thumb(n)}
    <div class="grow"><b>${esc(n)}</b><div class="muted small">${esc(h ? h[0] : '')}</div></div>
    <span class="dose">${esc(target(n))}</span></button>`;
}
function section(title, sub, names, numbered){
  return `<div class="sec"><div class="sech"><b>${title}</b>${sub ? `<span class="muted small">${sub}</span>` : ''}</div>
    <div class="card list" style="padding:0 12px">${names.map((n,i) => row(n, numbered ? i+1 : 0)).join('')}</div></div>`;
}
const WARM_NOTE = 'Ease into each stretch. No bouncing, and stop if it hurts.';

/* ---------- Views ---------- */
function viewWorkouts(){
  let html = header() + `<h2 style="margin-top:0">Workouts</h2>
    <p class="muted small" style="margin:-4px 0 12px">Each plan starts with warm-up stretches, then the exercises. Tap a plan to open it.</p>`;
  html += Object.entries(TEMPLATES).map(([n,l]) => `<button class="card plan" data-act="plan" data-v="${esc(n)}">
    <div class="pthumbs">${l.slice(0,3).map(e => thumb(e)).join('')}</div>
    <div class="row between" style="margin-top:10px"><h3>${PLAN_ICON[n] || '💪'} ${esc(n)}</h3><span class="muted small">${PLAN_WARM[n].length} stretches · ${l.length} exercises ›</span></div>
    <div class="muted small" style="margin-top:4px">${esc(PLAN_NOTE[n] || '')}</div></button>`).join('');
  html += `<h2>By muscle group</h2><div class="tpl">${Object.keys(LIB).map(g => `<button data-act="groupDay" data-v="${esc(g)}"><b>${esc(g)} Day</b><span>${WARM[g].length} stretches · ${LIB[g].length} exercises</span></button>`).join('')}</div>`;
  return html;
}
function planSheet(p){
  return `<div class="row between"><div><h3>${esc(p.title)}</h3><div class="muted small">${esc(p.note)}</div></div><button class="btn sm" data-act="close">Close</button></div>
    ${section('Step 1 · Warm-up stretches', 'about 5 min', p.warm, true)}
    <p class="muted small" style="margin:-4px 0 0">${WARM_NOTE}</p>
    ${section('Step 2 · Exercises', 'rest 1–2 min between sets', p.names, true)}
    <p class="muted small">Tap any stretch or exercise to see the animation, photos and how to do it.</p>`;
}

function libList(q){
  q = (q||'').trim().toLowerCase();
  if (q) {
    const all = [];
    for (const g in LIB) LIB[g].forEach(([n]) => all.push(n));
    Object.keys(STRETCH).forEach(n => all.push(n));
    const hits = all.filter(n => { const h = info(n); return n.toLowerCase().includes(q) || groupOf(n).toLowerCase().includes(q) || (h && h[0].toLowerCase().includes(q)); });
    return hits.length ? `<div class="card list" style="padding:0 12px">${hits.map(n => row(n)).join('')}</div>` : '<div class="card empty">No exercise found.</div>';
  }
  if (libGroup === 'Stretches') return section('All stretches', Object.keys(STRETCH).length + ' stretches', Object.keys(STRETCH));
  return section('Stretch first', 'about 3 min', WARM[libGroup]) + section(libGroup + ' exercises', LIB[libGroup].length + ' exercises', LIB[libGroup].map(([n]) => n));
}
function viewExercises(){
  const groups = Object.keys(LIB).concat('Stretches');
  return header() + `<h2 style="margin-top:0">Exercises</h2>
    <input id="lib-q" placeholder="Search e.g. chest, curl, stretch" autocomplete="off" style="margin-bottom:10px">
    <div class="chips" id="lib-chips">${groups.map(g => `<button class="${g === libGroup ? 'on' : ''}" data-act="libGroup" data-v="${esc(g)}">${esc(g)}</button>`).join('')}</div>
    <div id="lib-list">${libList('')}</div>`;
}
function openInfo(name){
  const h = info(name), st = isStretch(name), back = $('#modal').dataset.back;
  const tag = st ? 'stretch' : TYPE_LABEL[exType(name)];
  openModal(`<div class="row between"><div><h3>${esc(name)}</h3><div class="muted small">${st ? 'Warm-up stretch' : esc(groupOf(name)) + ` <span class="tag">${tag}</span>`}</div></div>
    <button class="btn sm" data-act="${back ? 'back' : 'close'}">${back ? '‹ Back' : 'Close'}</button></div>
    ${IMG[name] ? `<div class="anim" data-act="anim" role="img" aria-label="Animation of ${esc(name)}, switching between start and end position">
        <img src="${img(name,0)}" alt=""><img class="f2" src="${img(name,1)}" alt="">
        <span class="lbl l1">Start</span><span class="lbl l2">End</span><span class="pp" aria-hidden="true">▶ Paused</span></div>
      <div class="muted small" style="text-align:center;margin:6px 0 10px">Animation · tap to pause</div>
      <div class="stills"><figure><img src="${img(name,0)}" alt="${esc(name)}: start position" loading="lazy"><figcaption>1 · Start position</figcaption></figure>
        <figure><img src="${img(name,1)}" alt="${esc(name)}: end position" loading="lazy"><figcaption>2 · End position</figcaption></figure></div>` : ''}
    ${h ? `<div class="card" style="margin-top:12px"><div class="muted small">Muscles worked</div><b>${esc(h[0])}</b>
      <div class="muted small" style="margin-top:10px">${st ? 'How long' : 'Suggested'}</div><b>${esc(target(name))}</b>
      <div class="muted small" style="margin-top:10px">How to do it</div><ol style="margin:4px 0 0;padding-left:20px">${h[1].map(s => `<li style="margin:4px 0">${esc(s)}</li>`).join('')}</ol>
      <div class="tip">💡 ${esc(h[2])}</div></div>` : ''}
    <a class="btn block" href="https://www.youtube.com/results?search_query=${encodeURIComponent('how to do ' + name + (st ? '' : ' proper form'))}" target="_blank" rel="noopener" style="text-decoration:none;color:var(--text)">▶ Watch how-to videos</a>`, back);
}

/* ---------- Shell ---------- */
const ICONS = {
  workouts:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
  exercises:'<path d="M4 5h16M4 12h16M4 19h10"/><circle cx="19" cy="19" r="2"/>'
};
function render(){
  $('#app').innerHTML = tab === 'exercises' ? viewExercises() : viewWorkouts();
  $('#nav').innerHTML = [['workouts','Workouts'],['exercises','Exercises']].map(([k,l]) =>
    `<button class="${tab === k ? 'on' : ''}" data-act="tab" data-v="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${l}</button>`).join('');
}
function openModal(html, back){
  const m = $('#modal');
  m.innerHTML = `<div class="modal" data-act="bg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  if (back) m.dataset.back = back; else delete m.dataset.back;
}
function closeModal(){ const m = $('#modal'); m.innerHTML = ''; delete m.dataset.back; }
let lastPlan = null;
function showPlan(p){ lastPlan = p; openModal(planSheet(p)); $('#modal').dataset.back = '1'; }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'bg') { if (ev.target === el) closeModal(); return; }
  switch (act) {
    case 'tab': tab = v; closeModal(); render(); window.scrollTo(0,0); break;
    case 'plan': showPlan({title:(PLAN_ICON[v] || '') + ' ' + v, note:PLAN_NOTE[v] || '', warm:PLAN_WARM[v], names:TEMPLATES[v]}); break;
    case 'groupDay': showPlan({title:v + ' Day', note:'Do the stretches, then pick 4–5 of these exercises for one session.', warm:WARM[v], names:LIB[v].map(([n]) => n)}); break;
    case 'info': if (!$('#modal').innerHTML) delete $('#modal').dataset.back; openInfo(v); break;
    case 'back': lastPlan ? showPlan(lastPlan) : closeModal(); break;
    case 'anim': el.classList.toggle('paused'); break;
    case 'libGroup': libGroup = v; render(); break;
    case 'close': closeModal(); break;
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'lib-q') { $('#lib-list').innerHTML = libList(ev.target.value); $('#lib-chips').style.opacity = ev.target.value.trim() ? .4 : 1; }
});
window.bebaBack = function(){ const m = $('#modal'); if (!m.innerHTML) return false; if (m.dataset.back && lastPlan && $('[data-act="back"]')) showPlan(lastPlan); else closeModal(); return true; };
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });
render();

</script>
</body>
</html>
